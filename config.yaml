base_path: /opt/dpl

# Nur diese Playbooks und Inventories dürfen über die API verwendet werden
# (Pfade relativ zu base_path, müssen innerhalb von base_path liegen).
playbooks:
  - name: folder
    file: playbooks/folder.yaml
    retries: 1
  - name: file
    file: playbooks/file.yaml
    retries: 1

inventories:
  - inventories/home/home.yaml
  - inventories/test/test.yaml

ansible:
  timeout_seconds: 3600

deployment:
  continue_on_failure: false  # true: nach einem fehlgeschlagenen Playbook trotzdem weitermachen

git:
  timeout_seconds: 60
  remote: origin
  # Nur diese Branches dürfen ausgecheckt und deployed werden (Glob-Muster).
  # Ohne diesen Eintrag ist jeder Branch erlaubt. Wer auf einen freigegebenen Branch
  # pushen darf, kann Code auf dem Controller und allen Zielhosts ausführen – hier nur
  # Branches eintragen, die auf dem Git-Server geschützt sind (Review, kein Force-Push).
  allowed_branches:
    - main
    - release-*
  # Nur signierte Commits deployen (git verify-commit HEAD). Für SSH-Signaturen die
  # erlaubten Schlüssel als absoluten Pfad außerhalb von base_path angeben.
  require_signed_commits: false
  # allowed_signers_file: /etc/deployment-monitor/allowed_signers
  # Vor jedem Checkout ungetrackte UND ignorierte Dateien löschen (git clean -ffdx).
  clean_on_checkout: false

history:
  retention_days: 90          # Lauf-Historie älter als N Tage löschen, 0 = nie

limits:
  max_deployments: 1000
  max_items_per_deployment: 50

prometheus:
  job_name: ansible_deployment
  pushgateway_url: http://localhost:9091
